[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-storio-elements-editor"
version = "1.3.4"
description = "Django backend for @brainicon/storio-elements-editor: stores page content edited in Storio Elements Editor and serves its REST API."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Brainicon Technology" }]
requires-python = ">=3.10"
dependencies = ["Django>=4.2"]
classifiers = [
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[tool.setuptools.packages.find]
include = ["storio_elements_editor*"]
